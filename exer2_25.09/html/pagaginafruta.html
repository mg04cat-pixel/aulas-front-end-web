<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Exercício 2 - Página da Fruta</title>
    <link rel="stylesheet" href="../css/pagfrutastyle.css">
</head>
<body>
    <header>
        <div class="logo"> Penny Juice </div>
        <nav>
        <a href="#"> Sabores </a>
        <a href="#"> Vantagens </a>
        <a href="#"> Contatos </a>
        </nav>
    </header>

    <main>
        <section class="pt_1">
            <article>
                <h1>Sucos 100% fruta para sua creche</h1>
                <p>PennyJuice: Sabor, Qualidade e Diversão em Cada Gole!</p>
                <button>Solicitar Amostra Grátis</button>
            </article>
            <aside>
                <img src="https://tse4.mm.bing.net/th/id/OIP.ArPFrIeM8X9R9quN3sNaoQHaEp?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Imagem frutas">
            </aside>
        </section>
        <h1 class="sabores">Nossos Sabores Mais Populares</h1>
        <section class="pt_2">
            <article class="card">
                <b>Maçã Baga</b>
                <p>100% Natural</p>
            </article>
            <article class="card">
                <b>Frutas Tropicais</b>
                <p>Rico em vitamina C</p>
            </article>
            <article class="card">
                <b>Uva Branca</b>
                <p>Sem açúcar extra</p>
            </article>
        </section>
    </main>
    <footer>&copy;PennyJuuice</footer>
</body>
</html>
